[project]
name = "basivo-orch-api"
version = "0.1.0"
description = "Basivo Agent Orchestrator — API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    # --- added by basivo-auth ---
    "fastapi-users[sqlalchemy]>=15.0.5,<16",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "slowapi>=0.1.9",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "aiosmtplib>=3.0.2",
    "pyotp>=2.9.0",
    "httpx-oauth>=0.16.0",
    "authlib>=1.3.2",
    "qrcode[pil]>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # required by the generated auth test suite
    "aiosqlite>=0.20.0",
    "fakeredis>=2.26.1",
    "asgi-lifespan>=2.1.0",
    # Typing stubs the generated auth package needs to pass mypy. `basivo-auth
    # new` puts these in the projects it generates; `basivo-auth init` does not
    # list them, because in embedded mode the host owns pyproject.toml. Without
    # types-redis, `Redis[str]` in the auth package is an error — redis-py
    # itself does not ship a generic Redis.
    "types-redis>=4.6.0",
    "types-qrcode>=8.0",
]

# The generator that produced basivo_orch/auth/. Not needed at runtime — the
# auth code lives in this repo, it is not a dependency. Pinned here so the
# version that wrote the package is recorded next to it, and so
# `uv sync --group tools && basivo-auth update` always runs the matching CLI.
# Bump the tag, sync, then run the update to pull template fixes in.
# The authoritative record of what generated the package is
# apps/api/.copier-answers.yml (`_commit`); this keeps the tool in step with it.
tools = [
    "basivo-auth @ git+https://github.com/mohamedabubasith/basivo-auth.git@v0.3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["security: encodes a specific security control"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = [
    "S101",
    # `Depends(...)` and `Query(...)` in argument defaults is how FastAPI
    # declares dependencies. B008 exists to catch accidental shared mutable
    # defaults, which these are not.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# S105 flags any constant whose *name* contains PASSWORD/TOKEN/SECRET as a
# hardcoded credential. In the auth package those names belong to audit-action
# and token-type enum members whose values are literals like "token_refresh" —
# every hit is a false positive, and silencing them individually would mean
# editing generated code that `basivo-auth update` rewrites.
"basivo_orch/auth/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# The engine's `UserProtocol` declares plain attribute types (`email: str`).
# `basivo_orch.auth.models.User` types the same columns as SQLAlchemy
# `Mapped[...]`, which is what makes every `User.email == x` query expression
# type-check. mypy cannot see through the descriptor to match the protocol
# structurally, so it reports a type-var mismatch on a handful of engine call
# sites. Conformance holds at runtime and the auth suite exercises it.
#
# `basivo-auth new` writes this block into the projects it generates. `init`
# does not, because in embedded mode the host owns pyproject.toml — so an
# embedded install has to add it by hand, as here.
[[tool.mypy.overrides]]
module = [
    "basivo_orch.auth.engine.adapters",
    "basivo_orch.auth.engine.backends",
    "basivo_orch.auth.engine.dependencies",
    "basivo_orch.auth.engine.manager",
]
disable_error_code = ["type-var"]

[[tool.mypy.overrides]]
module = [
    "fastapi_users.*",
    "fastapi_users_db_sqlalchemy.*",
    "slowapi.*",
    "httpx_oauth.*",
    "authlib.*",
    "qrcode.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["basivo_orch"]
