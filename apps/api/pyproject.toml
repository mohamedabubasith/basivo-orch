[project]
name = "basivo-orch-api"
version = "0.1.0"
description = "Basivo Agent Orchestrator — API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    # --- added by basivo-auth ---
    "fastapi-users[sqlalchemy]>=15.0.5,<16",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "slowapi>=0.1.9",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "aiosmtplib>=3.0.2",
    "pyotp>=2.9.0",
    "httpx-oauth>=0.16.0",
    "authlib>=1.3.2",
    "qrcode[pil]>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # required by the generated auth test suite
    "aiosqlite>=0.20.0",
    "fakeredis>=2.26.1",
    "asgi-lifespan>=2.1.0",
]

# The generator that produced basivo_orch/auth/. Not needed at runtime — the
# auth code lives in this repo, it is not a dependency. Pinned here so the
# version that wrote the package is recorded next to it, and so
# `uv sync --group tools && basivo-auth update` always runs the matching CLI.
# Bump the tag, sync, then run the update to pull template fixes in.
# The authoritative record of what generated the package is
# apps/api/.copier-answers.yml (`_commit`); this keeps the tool in step with it.
tools = [
    "basivo-auth @ git+https://github.com/mohamedabubasith/basivo-auth.git@v0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["security: encodes a specific security control"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["basivo_orch"]
