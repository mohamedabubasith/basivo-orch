[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# The URL is read from the environment in migrations/env.py so that a database
# password never lands in a tracked file.
sqlalchemy.url =

[post_write_hooks]
# `exec` rather than `console_scripts`: ruff ships a compiled binary, so it has
# no console-script entry point for alembic to import.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = .venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
