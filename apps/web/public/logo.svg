<!-- The mark: a ticket sharpened into an arrow, with the run chevron cut
     out of it. One path, one fill, knockout by evenodd, so it survives a
     16px favicon and a one-colour print. The gradient is decoration only;
     the colours are baked because a favicon has no stylesheet. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="basivo" x1="3" y1="3" x2="29" y2="29"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a08cff"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <path fill="url(#basivo)" fill-rule="evenodd" d="M8.5 2.5h11.6L30 16l-9.9 13.5H8.5A6 6 0 0 1 2.5 23.5v-15A6 6 0 0 1 8.5 2.5ZM8.56 11.44 13.11 16 8.56 20.56a2.75 2.75 0 0 0 3.89 3.89L18.94 17.94a2.75 2.75 0 0 0 0-3.89L12.44 7.56a2.75 2.75 0 0 0-3.89 3.89Z"/>
</svg>
