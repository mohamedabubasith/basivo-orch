<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#06070c" />
    <title>Basivo: a ticket goes in, a pull request comes out</title>
    <meta
      name="description"
      content="Basivo runs agent pipelines. A GitHub issue or a Jira ticket fires the trigger, an agent changes the repository, and a pull request comes back. Every step shows its duration, its tokens and what it cost."
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Auth pages must never be framed: a transparent overlay over a real
         login form is how clickjacking harvests credentials. The API sends
         X-Frame-Options on its own responses; this covers the SPA, which is
         served by Vite in dev and by a static host in production. -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Basivo: a ticket goes in, a pull request comes out" />
    <meta
      property="og:description"
      content="Agent pipelines on a trigger, with the duration, tokens and cost of every step on the run page. Bring your own model key, or self-host the lot."
    />
      <script>
      // Applied before first paint. Doing this in React would render the
      // default theme and correct it a frame later — the flash every themed
      // app is judged by. Kept tiny and dependency-free on purpose.
      (function () {
        try {
          var choice = localStorage.getItem("basivo.theme");
          if (choice === "light" || choice === "dark") {
            document.documentElement.setAttribute("data-theme", choice);
            document.documentElement.style.colorScheme = choice;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui; color: #c7cddf">
        Basivo needs JavaScript enabled.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
