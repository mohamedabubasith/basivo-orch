name: basivo-orch

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: basivo
      POSTGRES_PASSWORD: basivo
      POSTGRES_DB: basivo_orch
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basivo -d basivo_orch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every outbound email locally. Verification and reset links land in
  # the web UI at http://localhost:8025 instead of a real inbox.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1026:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  postgres_data:
